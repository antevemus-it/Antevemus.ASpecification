name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  # The HTTP tests (Module 21) start a local php -S server; never route them through a proxy.
  NO_PROXY: 127.0.0.1,localhost

jobs:
  core:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: json, mbstring, curl, pdo_sqlite, sysvsem
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: PHPUnit
        run: vendor/bin/phpunit --no-coverage

      - name: Module runner
        run: php tests/run_all.php

  alinq-integration:
    name: PHP 8.4 with ALinq
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: json, mbstring, curl, pdo_sqlite, sysvsem
          coverage: none
          tools: composer:v2

      - name: Install dependencies with the optional ALinq package
        run: |
          composer install --no-interaction --no-progress --prefer-dist
          composer require --dev --no-interaction --no-progress "antevemus/alinq-collection:^2.0.0"

      - name: PHPUnit
        run: vendor/bin/phpunit --no-coverage

      - name: Module runner
        run: php tests/run_all.php
